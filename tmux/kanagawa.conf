set -g mode-style "fg=#DCD7BA,bg=#2D4F67"
set -g tree-mode-selection-style "fg=#16161D,bg=#7E9CD8,bold"
set -g message-style "fg=#DCD7BA,bg=#2D4F67"
set -g message-command-style "fg=#DCD7BA,bg=#2D4F67"
set -g pane-border-style "fg=#363646"
set -g pane-active-border-style "fg=#7E9CD8"
set -g display-panes-colour "#727169"
set -g display-panes-active-colour "#E6C384"
setw -g clock-mode-colour "#7E9CD8"
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=#727169,bg=#1F1F28"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right ""
setw -g window-status-separator ""
setw -g window-status-style "fg=#727169,bg=#1F1F28"
setw -g window-status-activity-style "fg=#E6C384,bg=#1F1F28"
setw -g window-status-bell-style "fg=#E46876,bg=#1F1F28,bold"
setw -g window-status-format "#[fg=#54546D,bg=#1F1F28,nobold]#[fg=#DCD7BA,bg=#54546D]#I #[fg=#DCD7BA,bg=#2A2A37] #{s|^/Users/tonic|~|:pane_current_path} #[fg=#2A2A37,bg=#1F1F28] "
setw -g window-status-current-format "#[fg=#957FB8,bg=#1F1F28,nobold]#[fg=#16161D,bg=#957FB8,bold]#I #[fg=#DCD7BA,bg=#363646,nobold] #{s|^/Users/tonic|~|:pane_current_path} #[fg=#363646,bg=#1F1F28] "
setw -g window-status-current-style "nounderscore"
